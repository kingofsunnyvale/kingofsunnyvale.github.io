<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="{{ '/style.css' | relative_url }}" />
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Noto+Sans+Tamil&display=swap" rel="stylesheet">
    <!-- Cloudflare Web Analytics -->
     <script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "1c5cfc9a773f4bf6b456b3a3a93be3be"}'></script>
     <!-- End Cloudflare Web Analytics -->
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  </head>
  <body class="jetbrains-mono-400-normal">
    <main class="mx-auto max-w-prose lg:max-w-xl px-6 lg:px-0 pt-24 pb-32 leading-relaxed tracking-wide text-lg">

      <!-- shared nav -->
      <nav aria-label="Primary links"
           class="flex flex-wrap gap-2 text-[19px] font-mono tracking-normal mt-6 mb-6">
        <a href="{{ '/' | relative_url }}"
           class="hover:text-blue-600{% if page.url == '/' %} text-blue-600{% endif %}">home</a><span>/</span>
        <a href="{{ '/blog' | relative_url }}"
           class="hover:text-blue-600{% if page.url contains '/blog' %} text-blue-600{% endif %}">blog</a><span>/</span>
        <a href="{{ '/contact' | relative_url }}"
           class="hover:text-blue-600{% if page.url == '/contact/' %} text-blue-600{% endif %}">contact</a>
      </nav>

      {{ content }}
    </main>

    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

        // split each nav link into per-character top/bottom layers for the roll effect
        const links = document.querySelectorAll('nav[aria-label="Primary links"] a');
        links.forEach(link => {
          const text = link.textContent.trim();
          link.textContent = '';
          link.classList.add('chr-hover');
          [...text].forEach(ch => {
            const wrap = document.createElement('span');
            wrap.className = 'ch-wrap';
            const top = document.createElement('span');
            top.className = 'ch-top';
            top.textContent = ch;
            const bot = document.createElement('span');
            bot.className = 'ch-bot';
            bot.textContent = ch;
            wrap.append(top, bot);
            link.appendChild(wrap);
          });
        });

        // hover: both layers roll up with a per-character delay
        const EASE = 'expo.inOut'; // ~ cubic-bezier(0.87, 0, 0.13, 1)
        links.forEach(link => {
          const wraps = link.querySelectorAll('.ch-wrap');
          const roll = to => wraps.forEach((w, i) =>
            gsap.to(w.children, { yPercent: to, duration: 0.6, ease: EASE,
              delay: i * 0.028, overwrite: true }));
          link.addEventListener('mouseenter', () => roll(-100));
          link.addEventListener('mouseleave', () => roll(0));
        });
      });
    </script>
  </body>
</html>
